<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - TokoIT</title>
  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
    <link rel="stylesheet" href="css/login-style.css">
  
    <script src="js/auth.js" defer></script>
</head>

<body class="login-page">
    <main class="login-container">
        <div class="login-card">
            <div class="brand-title">TokoIT</div>

            <div class="login-header">
                <h2>Masuk ke akunmu</h2>
                <p>Gunakan username & password akunmu.</p>
            </div>

            <div id="error-message" class="error-banner hidden"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Masukkan username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password">
                </div>

                <button type="submit" id="btn-submit" class="btn-primary">
                    <span id="btn-text">Masuk</span>
                    <span id="btn-loading" class="spinner hidden"></span>
                </button>
            </form>
        </div>

         
    </main>
</body>
</html>
